[workspace]
members = [
    "crates/pyenv-cli",
    "crates/pyenv-core",
    "crates/pyenv-mcp",
    "crates/pyenv-gui",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.7.0"
# Shared direct deps. Keep caret/minimum operators so `cargo update` can take
# the newest compatible crates.io releases without pinning exact versions.
[workspace.dependencies]
anyhow = "^1.0.104"
base64 = "^0.23.1"
bzip2 = "^0.6.1"
clap = { version = "^4.6.6", features = ["derive"] }
# 0.13 is the unic-langid line fluent-templates 0.15 still requires.
# 0.14.2 is a parallel icu_locid fork — do not bump until fluent-templates does.
fluent-langneg = "^0.13.0"
fluent-templates = "^0.15.1"
flate2 = "^1.1.9"
hex = "^0.4.3"
mockito = "^1.7.2"
opener = "^0.9.0"
reqwest = { version = "^0.13.4", default-features = false }
rfd = "^0.18.0"
rmcp = { version = "^3.9.0", features = ["transport-io"] }
schemars = "^1.2.2"
sha2 = "^0.11.0"
serde = { version = "^1.0.229", features = ["derive"] }
sys-locale = "^0.3.2"
serde_json = "^1.0.151"
tar = "^0.4.46"
tauri = "^2.12.5"
tauri-build = "^2.7.4"
tempfile = "^3.27.0"
thiserror = "^2.0.20"
tokio = "^1.53.1"
toml = "^1.1.4"
unic-langid = { version = "^0.9.6", features = ["macros"] }
winreg = "^0.56.0"
zip = { version = "^9.0.0", default-features = false }
