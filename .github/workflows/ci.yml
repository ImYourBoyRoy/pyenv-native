name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          
      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev pkg-config

      - name: Format check
        shell: bash
        run: cargo fmt --check

      - name: Shell script line-ending check
        shell: bash
        run: sh ./scripts/check-shell-eol.sh

      - name: Version sync check
        shell: bash
        run: sh ./scripts/check-version-sync.sh

      - name: GUI pattern guardrails
        shell: bash
        run: sh ./scripts/check-gui-patterns.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: GUI accessibility audit
        shell: bash
        run: |
          cd scripts/gui-a11y
          pnpm install --frozen-lockfile
          pnpm audit --prod
          pnpm run check

      - name: Rust advisory audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace -- -D warnings

      - name: Test Rust workspace
        shell: bash
        run: cargo test --workspace

      - name: Test Python install package
        shell: bash
        run: PYTHONPATH=./python-package/src python -m unittest discover -s ./python-package/tests -p "test_*.py"

      - name: Build CLI for bash shell smoke test
        shell: bash
        run: cargo build -p pyenv-cli

      - name: Smoke test bash shell integration
        shell: bash
        run: bash ./scripts/smoke-shells.sh ./target/debug/pyenv

      - name: Build Linux release bundle smoke test
        shell: bash
        run: sh ./scripts/build-release-bundle.sh --output-root ./dist

  windows-x64:
    runs-on: windows-latest
    env:
      PYENV_WINDOWS_TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Clippy
        shell: pwsh
        run: cargo clippy --workspace -- -D warnings

      - name: Test Rust workspace
        shell: pwsh
        run: .\scripts\dev-cargo.ps1 test

      - name: Test Python install package
        shell: pwsh
        run: .\scripts\test-python-bootstrap.ps1 -PythonPath python

      - name: Build CLI for Windows shell smoke tests
        shell: pwsh
        run: cargo build -p pyenv-cli

      - name: Smoke test PowerShell and CMD integration
        shell: pwsh
        run: .\scripts\smoke-shells.ps1

      - name: Build Windows x64 release bundle smoke test
        shell: pwsh
        run: .\scripts\build-release-bundle.ps1 -TargetTriple x86_64-pc-windows-msvc

      - name: Build Winget manifests smoke test
        shell: pwsh
        run: |
          .\scripts\build-winget-manifests.ps1 `
            -ReleaseBaseUrl https://example.invalid/releases/download/test `
            -OutputRoot .\packaging\winget

      - name: Build Python install package smoke test
        shell: pwsh
        run: .\scripts\build-python-bootstrap.ps1 -PythonPath python

  windows-arm64-smoke:
    runs-on: windows-latest
    env:
      PYENV_WINDOWS_TARGET: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build Windows ARM64 release bundle smoke test
        shell: pwsh
        run: .\scripts\build-release-bundle.ps1 -TargetTriple aarch64-pc-windows-msvc

  linux-arm64-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Cross
        run: cargo install cross --locked

      - name: Build Linux ARM64 release bundle smoke test
        shell: bash
        env:
          CARGO: cross
        run: |
          sh ./scripts/build-release-bundle.sh \
            --output-root ./dist \
            --target aarch64-unknown-linux-musl \
            --arch arm64

  android-arm64-smoke:
    runs-on: ubuntu-latest
    env:
      ANDROID_API_LEVEL: "21"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android ARM64 release bundle smoke test
        shell: bash
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          sh ./scripts/build-release-bundle.sh \
            --output-root ./dist \
            --target aarch64-linux-android \
            --platform android \
            --arch arm64

  macos-arm64-smoke:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace -- -D warnings

      - name: Test Rust workspace
        shell: bash
        run: cargo test --workspace

      - name: Test Python install package
        shell: bash
        run: PYTHONPATH=./python-package/src python -m unittest discover -s ./python-package/tests -p "test_*.py"

      - name: Build macOS arm64 release bundle smoke test
        shell: bash
        run: sh ./scripts/build-release-bundle.sh --output-root ./dist

      - name: Confirm GUI binary in bundle
        shell: bash
        run: test -f dist/pyenv-native-macos-arm64/pyenv-gui

  macos-x64-smoke:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace -- -D warnings

      - name: Test Rust workspace
        shell: bash
        run: cargo test --workspace

      - name: Test Python install package
        shell: bash
        run: PYTHONPATH=./python-package/src python -m unittest discover -s ./python-package/tests -p "test_*.py"

      - name: Build macOS x64 release bundle smoke test
        shell: bash
        run: sh ./scripts/build-release-bundle.sh --output-root ./dist

      - name: Confirm GUI binary in bundle
        shell: bash
        run: test -f dist/pyenv-native-macos-x64/pyenv-gui
