name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev pkg-config

      - name: Format check
        shell: bash
        run: cargo fmt --check

      - name: Shell script line-ending check
        shell: bash
        run: cargo xtask policy eol

      - name: Version sync check
        shell: bash
        run: cargo xtask version-check

      - name: GUI pattern guardrails
        shell: bash
        run: cargo xtask policy gui

      - name: i18n catalog check
        shell: bash
        run: cargo xtask policy i18n

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.12.1
          runtime: node@26
          install: false

      - name: GUI accessibility audit
        shell: bash
        run: |
          cd scripts/gui-a11y
          pnpm install --frozen-lockfile
          pnpm audit --prod
          pnpm run check

      - name: Rust advisory audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace -- -D warnings

      - name: Test Rust workspace
        shell: bash
        run: cargo test --workspace

      - name: Test Python install package
        shell: bash
        run: PYTHONPATH=./python-package/src python -m unittest discover -s ./python-package/tests -p "test_*.py"

      - name: Build CLI for bash shell smoke test
        shell: bash
        run: cargo build -p pyenv-cli

      - name: Smoke test bash shell integration
        shell: bash
        run: bash ./scripts/smoke-shells.sh ./target/debug/pyenv

      - name: Build Linux release bundle smoke test
        shell: bash
        run: cargo xtask bundle --output-root ./dist

      - name: Build Debian and RPM packages
        shell: bash
        run: |
          cargo xtask installer deb --bundle ./dist/pyenv-native-linux-x64.tar.gz --output-root ./dist
          cargo xtask installer rpm --bundle ./dist/pyenv-native-linux-x64.tar.gz --output-root ./dist

      - name: Exercise the .deb (install, package-managed updater, remove)
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg -i ./dist/pyenv-native_*_amd64.deb
          pyenv --version
          if out="$(pyenv self-update --check 2>&1)"; then
            echo "self-update should refuse on a package-managed install" >&2
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "managed by a package manager"
          sudo dpkg -r pyenv-native
          test ! -e /usr/bin/pyenv

      - name: Inspect the .rpm
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends rpm
          rpm -qpi ./dist/pyenv-native-*.x86_64.rpm
          rpm -qpl ./dist/pyenv-native-*.x86_64.rpm | grep -q '^/usr/bin/pyenv$'

  linux-packages:
    # Built on the oldest supported runner so the glibc floor stays at Ubuntu 22.04.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build bundle and packages
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask bundle --no-gui --output-root ./dist
          cargo xtask installer deb --bundle ./dist/pyenv-native-linux-x64.tar.gz --output-root ./dist/packages --max-glibc 35
          cargo xtask installer rpm --bundle ./dist/pyenv-native-linux-x64.tar.gz --output-root ./dist/packages --max-glibc 35

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: dist/packages/*

  linux-package-compat:
    name: package on ${{ matrix.image }}
    needs: linux-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "debian:12", kind: deb }
          - { image: "debian:13", kind: deb }
          - { image: "rockylinux:9", kind: rpm }
          - { image: "fedora:latest", kind: rpm }
          - { image: "amazonlinux:2023", kind: rpm }
          - { image: "opensuse/leap:15.6", kind: rpm }

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: packages

      - name: Install, run, check updater, remove
        shell: bash
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/check.sh"
          if [ "${{ matrix.kind }}" = deb ]; then
            cat > "$check" <<'EOS'
          apt-get update -qq
          apt-get install -y --no-install-recommends /packages/pyenv-native_*_amd64.deb
          pyenv --version
          pyenv-mcp guide >/dev/null
          out="$(pyenv self-update --check 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "managed by a package manager"
          sh -c '. /etc/profile.d/pyenv-native.sh; echo "$PATH"' | grep -q /.pyenv/shims
          apt-get remove -y pyenv-native
          test ! -e /usr/bin/pyenv
          EOS
          else
            cat > "$check" <<'EOS'
          if command -v zypper >/dev/null; then
            zypper --non-interactive --no-gpg-checks install --allow-unsigned-rpm /packages/pyenv-native-*.x86_64.rpm
          else
            dnf install -y --nogpgcheck /packages/pyenv-native-*.x86_64.rpm
          fi
          pyenv --version
          out="$(pyenv self-update --check 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "managed by a package manager"
          rpm -e pyenv-native
          test ! -e /usr/bin/pyenv
          EOS
          fi
          docker run --rm -v "$PWD/packages:/packages:ro" -v "$check:/check.sh:ro" "${{ matrix.image }}" sh -e /check.sh

  windows-x64:
    runs-on: windows-latest
    env:
      PYENV_WINDOWS_TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Clippy
        shell: pwsh
        run: cargo clippy --workspace -- -D warnings

      - name: Test Rust workspace
        shell: pwsh
        run: .\scripts\dev-cargo.ps1 test

      - name: Test Python install package
        shell: pwsh
        run: cargo xtask python test --python python

      - name: Build CLI for Windows shell smoke tests
        shell: pwsh
        run: cargo build -p pyenv-cli

      - name: Smoke test PowerShell and CMD integration
        shell: pwsh
        run: .\scripts\smoke-shells.ps1

      - name: Build Windows x64 release bundle smoke test
        shell: pwsh
        run: cargo xtask bundle --target x86_64-pc-windows-msvc

      - name: Build the NSIS setup
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          cargo xtask installer nsis `
            --bundle ./dist/pyenv-native-windows-x64.zip `
            --output-root ./dist `
            --makensis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"

      - name: Exercise the NSIS setup (install, upgrade in place, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path ./dist/pyenv-native-windows-x64-setup.exe).Path
          $root = Join-Path $env:RUNNER_TEMP 'pyenv-nsis-root'
          $arpKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\pyenv-native'

          $run = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$root" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "setup exited with $($run.ExitCode)" }
          & "$root\bin\pyenv.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'installed pyenv.exe does not run' }
          $arp = Get-ItemProperty $arpKey
          if ($arp.InstallLocation -ne $root) { throw "Apps & features points at $($arp.InstallLocation), expected $root" }

          # A second run without /D= must find the existing root and upgrade it in place.
          $run = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "upgrade exited with $($run.ExitCode)" }
          if ((Get-ItemProperty $arpKey).InstallLocation -ne $root) { throw 'upgrade created a second install' }

          cmd /c $arp.QuietUninstallString
          if ($LASTEXITCODE -ne 0) { throw 'uninstall failed' }
          if (Test-Path $arpKey) { throw 'Apps & features entry survived uninstall' }
          for ($i = 0; $i -lt 90 -and (Test-Path $root); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $root) {
            Write-Host '--- left behind ---'
            Get-ChildItem $root -Recurse -Force | Select-Object -First 40 -ExpandProperty FullName
            Write-Host '--- uninstall helper ---'
            Get-ChildItem (Join-Path $env:TEMP 'pyenv-native-uninstall-*') -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object {
              $_.FullName
              if ($_.Name -eq 'uninstall.log') { Get-Content $_.FullName }
            }
            Get-Process -Name 'pyenv*' -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, Path
            throw "$root was not removed"
          }


      - name: Build Python install package smoke test
        shell: pwsh
        run: cargo xtask python build --python python

  windows-arm64-smoke:
    runs-on: windows-latest
    env:
      PYENV_WINDOWS_TARGET: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build Windows ARM64 release bundle smoke test
        shell: pwsh
        run: cargo xtask bundle --target aarch64-pc-windows-msvc

  linux-arm64-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Cross
        run: cargo install cross --locked

      - name: Build Linux ARM64 release bundle smoke test
        shell: bash
        env:
          XTASK_CARGO: cross
        run: |
          cargo xtask bundle \
            --output-root ./dist \
            --target aarch64-unknown-linux-musl \
            --arch arm64

  android-arm64-smoke:
    runs-on: ubuntu-latest
    env:
      ANDROID_API_LEVEL: "21"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android ARM64 release bundle smoke test
        shell: bash
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          cargo xtask bundle \
            --output-root ./dist \
            --target aarch64-linux-android \
            --platform android \
            --arch arm64

  macos-arm64-smoke:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace -- -D warnings

      - name: Test Rust workspace
        shell: bash
        run: cargo test --workspace

      - name: Test Python install package
        shell: bash
        run: PYTHONPATH=./python-package/src python -m unittest discover -s ./python-package/tests -p "test_*.py"

      - name: Build macOS arm64 release bundle smoke test
        shell: bash
        run: cargo xtask bundle --output-root ./dist

      - name: Confirm GUI binary in bundle
        shell: bash
        run: test -f dist/pyenv-native-macos-arm64/pyenv-gui

  macos-x64-smoke:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace -- -D warnings

      - name: Test Rust workspace
        shell: bash
        run: cargo test --workspace

      - name: Test Python install package
        shell: bash
        run: PYTHONPATH=./python-package/src python -m unittest discover -s ./python-package/tests -p "test_*.py"

      - name: Build macOS x64 release bundle smoke test
        shell: bash
        run: cargo xtask bundle --output-root ./dist

      - name: Confirm GUI binary in bundle
        shell: bash
        run: test -f dist/pyenv-native-macos-x64/pyenv-gui
