name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64-bundle:
    runs-on: windows-latest
    env:
      PYENV_WINDOWS_TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Version sync check
        shell: pwsh
        run: |
          $expected = ''
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -match '^v(.+)$') {
            $expected = $Matches[1]
          }
          if ($expected) { cargo xtask version-check --expected $expected } else { cargo xtask version-check }

      - name: Test Rust workspace
        shell: pwsh
        run: .\scripts\dev-cargo.ps1 test

      - name: Test Python install package
        shell: pwsh
        run: cargo xtask python test --python python

      - name: Build Windows x64 release bundle
        shell: pwsh
        run: cargo xtask bundle --target x86_64-pc-windows-msvc

      - name: Build Python install package
        shell: pwsh
        run: cargo xtask python build --python python

      - name: Prepare standalone GUI asset (Windows x64)
        shell: pwsh
        run: |
          $src = "dist/pyenv-native-windows-x64/pyenv-gui.exe"
          if (-not (Test-Path $src)) { throw "missing $src" }
          Copy-Item $src "dist/pyenv-gui-windows-x64.exe"
          $hash = (Get-FileHash "dist/pyenv-gui-windows-x64.exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path "dist/pyenv-gui-windows-x64.exe.sha256" -Value $hash

      - name: Upload Windows x64 bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyenv-native-windows-x64-bundle
          path: |
            dist/pyenv-native-windows-x64.zip
            dist/pyenv-native-windows-x64.zip.sha256
            dist/pyenv-gui-windows-x64.exe
            dist/pyenv-gui-windows-x64.exe.sha256

      - name: Upload Python install package artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyenv-native-python-package
          path: python-package/dist/*

  windows-arm64-bundle:
    runs-on: windows-latest
    env:
      PYENV_WINDOWS_TARGET: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # pyenv-gui is omitted here: Tauri/WebView2 cannot be cross-compiled
      # from the x64 runner, so this bundle ships CLI + MCP only.
      - name: Build Windows ARM64 release bundle
        shell: pwsh
        run: cargo xtask bundle --target aarch64-pc-windows-msvc

      - name: Upload Windows ARM64 bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyenv-native-windows-arm64-bundle
          path: |
            dist/pyenv-native-windows-arm64.zip
            dist/pyenv-native-windows-arm64.zip.sha256

  linux-bundle:
    # Oldest supported glibc (2.35): binaries built here run on Ubuntu 22.04+, Debian 12+, and
    # RHEL 9-class distributions. `installer deb|rpm --max-glibc 35` fails the release if this drifts.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          
      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev pkg-config

      - name: Test Rust workspace
        shell: bash
        run: cargo test --workspace

      - name: Test Python install package
        shell: bash
        run: PYTHONPATH=./python-package/src python -m unittest discover -s ./python-package/tests -p "test_*.py"

      - name: Build Linux release bundle
        shell: bash
        run: cargo xtask bundle --output-root ./dist

      - name: Prepare standalone GUI asset (Linux x64)
        run: |
          src="dist/pyenv-native-linux-x64/pyenv-gui"
          if [ ! -f "$src" ]; then
            echo "error: missing $src" >&2
            exit 1
          fi
          cp "$src" "dist/pyenv-gui-linux-x64"
          sha256sum "dist/pyenv-gui-linux-x64" | awk '{print $1}' > "dist/pyenv-gui-linux-x64.sha256"

      - name: Upload Linux bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyenv-native-linux-bundle
          path: |
            dist/pyenv-native-linux-*.tar.gz
            dist/pyenv-native-linux-*.tar.gz.sha256
            dist/pyenv-gui-linux-x64
            dist/pyenv-gui-linux-x64.sha256

  linux-arm64-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Cross
        run: cargo install cross --locked

      - name: Build Linux ARM64 release bundle
        shell: bash
        env:
          XTASK_CARGO: cross
        run: |
          cargo xtask bundle \
            --output-root ./dist \
            --target aarch64-unknown-linux-musl \
            --arch arm64

      - name: Upload Linux ARM64 bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyenv-native-linux-arm64-bundle
          path: |
            dist/pyenv-native-linux-arm64.tar.gz
            dist/pyenv-native-linux-arm64.tar.gz.sha256

  android-arm64-bundle:
    runs-on: ubuntu-latest
    env:
      ANDROID_API_LEVEL: "21"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android ARM64 release bundle
        shell: bash
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_ROOT
          cargo xtask bundle \
            --output-root ./dist \
            --target aarch64-linux-android \
            --platform android \
            --arch arm64

      - name: Upload Android ARM64 bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyenv-native-android-arm64-bundle
          path: |
            dist/pyenv-native-android-arm64.tar.gz
            dist/pyenv-native-android-arm64.tar.gz.sha256

  macos-arm64-bundle:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Test Rust workspace
        shell: bash
        run: cargo test --workspace

      - name: Test Python install package
        shell: bash
        run: PYTHONPATH=./python-package/src python -m unittest discover -s ./python-package/tests -p "test_*.py"

      - name: Build macOS arm64 release bundle
        shell: bash
        run: cargo xtask bundle --output-root ./dist

      - name: Prepare standalone GUI asset (macOS arm64)
        run: |
          src="dist/pyenv-native-macos-arm64/pyenv-gui"
          if [ ! -f "$src" ]; then
            echo "error: missing $src" >&2
            exit 1
          fi
          cp "$src" "dist/pyenv-gui-macos-arm64"
          shasum -a 256 "dist/pyenv-gui-macos-arm64" | awk '{print $1}' > "dist/pyenv-gui-macos-arm64.sha256"

      - name: Upload macOS arm64 bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyenv-native-macos-arm64-bundle
          path: |
            dist/pyenv-native-macos-arm64.tar.gz
            dist/pyenv-native-macos-arm64.tar.gz.sha256
            dist/pyenv-gui-macos-arm64
            dist/pyenv-gui-macos-arm64.sha256

  macos-x64-bundle:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Test Rust workspace
        shell: bash
        run: cargo test --workspace

      - name: Test Python install package
        shell: bash
        run: PYTHONPATH=./python-package/src python -m unittest discover -s ./python-package/tests -p "test_*.py"

      - name: Build macOS x64 release bundle
        shell: bash
        run: cargo xtask bundle --output-root ./dist

      - name: Prepare standalone GUI asset (macOS x64)
        run: |
          src="dist/pyenv-native-macos-x64/pyenv-gui"
          if [ ! -f "$src" ]; then
            echo "error: missing $src" >&2
            exit 1
          fi
          cp "$src" "dist/pyenv-gui-macos-x64"
          shasum -a 256 "dist/pyenv-gui-macos-x64" | awk '{print $1}' > "dist/pyenv-gui-macos-x64.sha256"

      - name: Upload macOS x64 bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: pyenv-native-macos-x64-bundle
          path: |
            dist/pyenv-native-macos-x64.tar.gz
            dist/pyenv-native-macos-x64.tar.gz.sha256
            dist/pyenv-gui-macos-x64
            dist/pyenv-gui-macos-x64.sha256

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - windows-x64-bundle
      - windows-arm64-bundle
      - linux-bundle
      - linux-arm64-bundle
      - android-arm64-bundle
      - macos-arm64-bundle
      - macos-x64-bundle
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain (for cargo xtask)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Download Windows x64 bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: pyenv-native-windows-x64-bundle
          path: dist/windows/x64

      - name: Download Windows ARM64 bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: pyenv-native-windows-arm64-bundle
          path: dist/windows/arm64

      - name: Download Linux bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: pyenv-native-linux-bundle
          path: dist/linux

      - name: Download Linux ARM64 bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: pyenv-native-linux-arm64-bundle
          path: dist/linux

      - name: Download Android ARM64 bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: pyenv-native-android-arm64-bundle
          path: dist/android

      - name: Download macOS arm64 bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: pyenv-native-macos-arm64-bundle
          path: dist/macos

      - name: Download macOS x64 bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: pyenv-native-macos-x64-bundle
          path: dist/macos

      - name: Download Python install package artifact
        uses: actions/download-artifact@v8
        with:
          name: pyenv-native-python-package
          path: dist/python

      - name: Generate Homebrew formula
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          cargo xtask package homebrew `
            --github-repo $repo `
            --tag $tag `
            --asset-root ./dist/linux `
            --asset-root ./dist/macos `
            --output ./dist/homebrew/pyenv-native.rb

      - name: Hash installer scripts
        shell: bash
        run: |
          for f in install.ps1 install.sh uninstall.ps1 uninstall.sh; do
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done

      - name: Install NSIS
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis

      - name: Build native installers (deb, rpm, Termux, NSIS)
        shell: bash
        run: |
          set -euo pipefail
          out=dist/installers
          for arch in x64 arm64; do
            cargo xtask installer deb --bundle "dist/linux/pyenv-native-linux-$arch.tar.gz" --output-root "$out" --max-glibc 35
            cargo xtask installer rpm --bundle "dist/linux/pyenv-native-linux-$arch.tar.gz" --output-root "$out" --max-glibc 35
            cargo xtask installer nsis --bundle "dist/windows/$arch/pyenv-native-windows-$arch.zip" --output-root "$out"
          done
          cargo xtask installer termux --bundle dist/android/pyenv-native-android-arm64.tar.gz --output-root "$out"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom/pyenv-native.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp install.ps1 install.sh uninstall.ps1 uninstall.sh dist/release/
          find dist/windows dist/linux dist/android dist/macos dist/installers dist/homebrew dist/python dist/sbom -type f -exec cp {} dist/release/ \;
          cargo xtask checksums dist/release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/release/*

      - name: Publish release assets
        uses: softprops/action-gh-release@v3.0.4
        with:
          generate_release_notes: true
          files: |
            dist/release/SHA256SUMS
            dist/installers/*
            dist/sbom/*
            install.ps1
            install.ps1.sha256
            install.sh
            install.sh.sha256
            uninstall.ps1
            uninstall.ps1.sha256
            uninstall.sh
            uninstall.sh.sha256
            dist/windows/**
            dist/linux/**
            dist/android/**
            dist/macos/**
            dist/homebrew/**
            dist/python/*

  publish-python:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - publish-release
      - windows-x64-bundle
    environment:
      name: pyenv-native
      url: https://pypi.org/p/pyenv-native
    permissions:
      id-token: write

    steps:
      - name: Download Python install package artifact
        uses: actions/download-artifact@v8
        with:
          name: pyenv-native-python-package
          path: dist

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Fail loudly if a stale package version is re-uploaded; never silently keep PyPI behind the Git tag.
          skip-existing: false
