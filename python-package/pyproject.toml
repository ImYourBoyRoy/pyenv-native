[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "enchi"
version = "0.8.2"
description = "Python install package for the native Enchi release bundles (formerly pyenv-native)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Roy Dawson IV", email = "Roy.Dawson.IV@gmail.com" },
]
keywords = ["enchi", "pyenv", "python", "windows", "bootstrap", "pipx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development",
  "Topic :: System :: Installation/Setup",
]

[project.urls]
Homepage = "https://github.com/imyourboyroy"
Repository = "https://github.com/imyourboyroy/pyenv-native"
Issues = "https://github.com/imyourboyroy/pyenv-native/issues"

[project.scripts]
enchi-bootstrap = "enchi_bootstrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/enchi_bootstrap"]

[tool.hatch.build.targets.sdist]
include = [
  "src/enchi_bootstrap",
  "tests",
  "LICENSE",
  "README.md",
  "pyproject.toml",
]



